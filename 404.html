<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101612">
  <meta name="robots" content="noindex">
  <title>Page not found — Md Zafar Sadak</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; --bg: #101612; --text: #f0f2ec; --muted: #a2aca2; --line: rgba(223, 235, 220, .16); --accent: #c5f36a; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 28px; background: var(--bg); color: var(--text); font: 16px/1.7 "Helvetica Neue", sans-serif; }
    main { width: min(620px, 100%); padding: clamp(28px, 7vw, 60px); border: 1px solid var(--line); }
    .mark { display: grid; width: 42px; height: 42px; place-items: center; border: 1px solid var(--line); border-radius: 50%; color: var(--accent); font: 12px monospace; }
    .code { margin: 48px 0 0; color: var(--accent); font: 12px monospace; letter-spacing: .12em; }
    h1 { margin: 12px 0; font-size: clamp(38px, 8vw, 64px); line-height: 1; letter-spacing: -.06em; }
    p { max-width: 410px; margin: 0; color: var(--muted); }
    a { display: inline-flex; gap: 10px; align-items: center; margin-top: 28px; padding: 11px 15px; border: 1px solid var(--accent); color: var(--accent); font-size: 13px; font-weight: 600; text-decoration: none; transition: background .2s ease, color .2s ease; }
    a:hover { background: var(--accent); color: #17200d; }
  </style>
</head>
<body>
  <main>
    <span class="mark" aria-hidden="true">ZS</span>
    <p class="code">ERROR 404 · PAGE NOT FOUND</p>
    <h1>Wrong turn.</h1>
    <p>The page you’re looking for may have moved or no longer exists. Let’s get you back to the portfolio.</p>
    <a href="./">Back to the portfolio <span aria-hidden="true">↗</span></a>
  </main>
</body>
</html>
